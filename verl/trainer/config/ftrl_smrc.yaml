# Qwen3-4B FTRL main table: plain FullPath-SD or exact-state SMRC-SD.
defaults:
  - ppo_trainer
  - _self_

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  path_opd:
    enable: true
    loss_type: sdl
    teacher_context: gt_path
    student_context: none
    sdl_loss_mode: chosen_token_k3
    sdl_loss_normalization: response_token_mean
    sdl_mask_special_tokens: false
    state_sdl_selection: match_only
    policy_loss_filter: none
    in_batch_success_path: false
    opd_coef: 0.01
    recovery_state_domain: ftrl

env:
  env_name: ftrl
  max_steps: 10
  seed: 0
  history_length: 10
  rollout:
    n: 8
  ftrl:
    variant: exact
    teacher_view: auto
    query_equivalence: null
    url: http://127.0.0.1:28980
    references: null
    state_defaults: null
    teacher_prompt_length: 24576
    enable_thinking: false
    prompt_style: concise_shared_v1
    audit_dir: null

data:
  train_batch_size: 32
  val_batch_size: 200
  max_prompt_length: 12288
  max_response_length: 4096
  return_raw_chat: true
  filter_overlong_prompts: false
  truncation: error
  dataloader_num_workers: 0
  seed: 0
  train_files: null
  val_files: null

actor_rollout_ref:
  model:
    enable_gradient_checkpointing: true
  actor:
    use_invalid_action_penalty: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0.001
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 16384
    checkpoint:
      contents: [model]
  rollout:
    n: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    gpu_memory_utilization: 0.45
    tensor_model_parallel_size: 1
    enforce_eager: false
    free_cache_engine: false
    keep_engine_awake_during_multiturn: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 32768
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 65536
    val_kwargs:
      n: 1
      do_sample: false
      temperature: 0.0

trainer:
  n_gpus_per_node: 8
  nnodes: 1
  total_training_steps: 207
  total_epochs: 3
  save_freq: 207
  test_freq: 25
  val_before_train: true
  resume_mode: disable
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: 1
  project_name: smrc_sd_ftrl
  logger: [console]
